<!doctype html>
<!--
  HW4 review interface (Cartwheel). Served by analysis/review_app/server.py.

  Views: Review (session-grouped conversation + margin notes + AI suggestions),
  Taxonomy (modes and their supporting open codes), Label (trace x mode
  Pass/Fail grid, synced to Langfuse scores), Progress (batches, coverage,
  incomplete judgments).

  Visual encoding: hue = speaker (user blue, agent green, tool grey); a tool
  call and its result share one card; structural outliers are header badges;
  tool results are never dimmed. AI suggestions use a dashed purple border
  and never mix with human notes.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartwheel Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --dim: #6b7383; --line: #dfe3ea;
    --user: #2563eb; --user-bg: #eef4ff; --agent: #15803d; --agent-bg: #effaf2;
    --tool: #64748b; --tool-bg: #f3f5f8; --bad: #c2410c; --bad-bg: #fff1e8;
    --warn: #a16207; --warn-bg: #fdf7e3; --ai: #7c3aed; --ai-bg: #f6f1ff;
    --note: #b45309; --note-bg: #fff8eb; --ok: #15803d; --mono: ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --ink: #e5e9f0; --dim: #949cab; --line: #2c333f;
      --user: #7aa7ff; --user-bg: #17233b; --agent: #5fd08a; --agent-bg: #152a1e;
      --tool: #9aa6b8; --tool-bg: #1f252e; --bad: #ff9a62; --bad-bg: #36211a;
      --warn: #e7c260; --warn-bg: #2f2a17; --ai: #b794ff; --ai-bg: #251d38;
      --note: #f4b860; --note-bg: #30261a; --ok: #5fd08a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 10px; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  textarea { width: 100%; resize: vertical; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 var(--mono); }
  .dim { color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12px; }

  header.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 15px; margin: 0 8px 0 0; }
  .tabs button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .spacer { flex: 1; }
  .status { font-size: 12px; }
  .view { display: none; } .view.active { display: block; }

  /* review */
  .shead { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .shead .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0; }
  .sid { font-weight: 650; font-size: 16px; }
  .chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--bg); }
  .chip.role { border-color: var(--user); color: var(--user); font-weight: 600; }
  .badge { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.done { background: var(--agent-bg); color: var(--ok); }
  .expected { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 4px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .turnhead { display: flex; gap: 8px; align-items: center; margin: 18px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .turnhead:first-child { margin-top: 0; }
  .turnhead::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .turnhead a { color: var(--dim); text-transform: none; letter-spacing: 0; }
  .msg { position: relative; margin: 6px 0; padding: 8px 12px; border-radius: 8px; border-left: 4px solid; }
  .msg .who { font-size: 11px; font-weight: 700; letter-spacing: .05em; margin-bottom: 2px; }
  .msg.user { background: var(--user-bg); border-color: var(--user); } .msg.user .who { color: var(--user); }
  .msg.agent { background: var(--agent-bg); border-color: var(--agent); } .msg.agent .who { color: var(--agent); }
  .msg.tool { background: var(--tool-bg); border-color: var(--tool); margin-left: 24px; } .msg.tool .who { color: var(--tool); }
  .msg.tool.err { border-color: var(--bad); }
  .msg.has-note { box-shadow: 0 0 0 2px var(--note) inset; }
  .msg.first-fail { box-shadow: 0 0 0 2px var(--bad) inset; }
  .msg.flash { animation: flash 1.2s; }
  @keyframes flash { 0%, 60% { outline: 3px solid var(--note); } 100% { outline: 3px solid transparent; } }
  .msg .addnote { position: absolute; top: 6px; right: 8px; font-size: 11px; padding: 0 6px; opacity: 0; }
  .msg:hover .addnote { opacity: 1; }
  .tsum { font-family: var(--mono); font-size: 12px; }
  .tsum .k { color: var(--dim); }
  details > summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .pol { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pol button { font-size: 11px; padding: 0 8px; }
  .poltext { margin-top: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); max-height: 320px; overflow: auto; }
  .agent-text p { margin: 0 0 6px; } .agent-text ul { margin: 0 0 6px; padding-left: 20px; }
  .navrow { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }

  .margin { position: sticky; top: 56px; max-height: calc(100vh - 72px); overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .box h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .note { border-left: 3px solid var(--note); background: var(--note-bg); padding: 6px 8px; border-radius: 4px; margin: 6px 0; cursor: pointer; }
  .note.ff { border-color: var(--bad); }
  .note.nf { border-color: var(--ok); background: var(--agent-bg); }
  .note.gap { border-color: var(--warn); background: var(--warn-bg); border-left-style: dashed; }
  .note .q { font-style: italic; color: var(--dim); font-size: 12px; }
  .note .acts { display: flex; gap: 6px; margin-top: 4px; }
  .note .acts button { font-size: 11px; padding: 0 6px; }
  .sugg { border: 1px dashed var(--ai); background: var(--ai-bg); padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
  .sugg .src { font-size: 11px; font-weight: 700; color: var(--ai); }
  .composer label { font-size: 12px; display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  #selbtn { position: absolute; z-index: 10; display: none; font-size: 12px; background: var(--note); color: #fff; border-color: var(--note); }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.open { display: flex; }
  .modal .inner { background: var(--panel); border-radius: 10px; max-width: 860px; width: 100%; max-height: 85vh; overflow: auto; padding: 16px; }

  /* taxonomy / label / progress */
  .page { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .tax { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .tax { grid-template-columns: 1fr; } }
  .mode { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .mode.rejected { opacity: .65; }
  .mode .grid { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; align-items: start; }
  .mode .grid > label { font-size: 12px; color: var(--dim); padding-top: 5px; }
  .tchip { display: inline-flex; gap: 4px; align-items: center; font: 12px var(--mono); padding: 0 6px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); margin: 2px; }
  .tchip a { color: inherit; } .tchip button { border: 0; padding: 0 2px; background: none; color: var(--dim); }
  .code { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .code .meta { font-size: 12px; color: var(--dim); }
  .assign { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .assign button { font-size: 11px; padding: 0 6px; }
  .assign button.on { background: var(--note); border-color: var(--note); color: #fff; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: middle; font-size: 13px; }
  th { position: sticky; top: var(--top-h, 49px); background: var(--panel); z-index: 2; }
  td.cell { white-space: nowrap; text-align: center; }
  td.cell button { padding: 0 8px; font-size: 12px; }
  td.cell button.pass { background: var(--agent-bg); color: var(--ok); border-color: var(--ok); font-weight: 700; }
  td.cell button.fail { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-weight: 700; }
  .sync { font-size: 10px; } .sync.ok { color: var(--ok); } .sync.local { color: var(--warn); }
  tr.sess td { background: var(--bg); font-weight: 600; }
  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 140px; }
  .kpi .v { font-size: 22px; font-weight: 650; } .kpi .l { font-size: 12px; color: var(--dim); }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  a.lnk { color: var(--user); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <h1>Cartwheel <span class="dim">review</span></h1>
  <div class="tabs">
    <button data-view="review" class="active">Review</button>
    <button data-view="taxonomy">Taxonomy</button>
    <button data-view="label">Label</button>
    <button data-view="progress">Progress</button>
  </div>
  <select id="batchsel" title="Which sessions to step through"></select>
  <input id="jump" placeholder="jump: support-0251" size="16" />
  <div class="spacer"></div>
  <span id="status" class="status dim"></span>
</header>

<section id="v-review" class="view active">
  <div id="shead" class="shead"></div>
  <div class="layout">
    <div id="convo"></div>
    <aside class="margin">
      <div class="box"><h3>My notes</h3><div id="notes"></div><div id="composer"></div></div>
      <div class="box"><h3>AI suggestions <span class="dim">(not labels)</span></h3><div id="suggs"></div></div>
    </aside>
  </div>
</section>
<section id="v-taxonomy" class="view"><div class="page" id="taxpage"></div></section>
<section id="v-label" class="view"><div class="page" id="labelpage"></div></section>
<section id="v-progress" class="view"><div class="page" id="progpage"></div></section>

<button id="selbtn">+ note on selection</button>
<div class="modal" id="modal"><div class="inner" id="modalbody"></div></div>

<script>
"use strict";
const S = {
  sessions: [], bySession: {}, byScenario: {}, byTrace: {},
  annotations: [], patterns: { modes: [] }, suggestions: [], manifest: {}, labels: {},
  langfuse: false, prompt: null, policies: new Set(),
  view: "review", batch: "review", list: [], cur: 0, reveal: false, composer: null, codeFilter: "unassigned",
  labelFilter: "all",
};

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toISOString();
// Local Langfuse (observability/docker-compose.yml: LANGFUSE_INIT_PROJECT_ID)
const LANGFUSE_TRACE_URL = "http://localhost:3000/project/cartwheel-dev/traces/";
const newId = (p) => p + "-" + Math.random().toString(36).slice(2, 10);
const fmtTime = (ts) => ts ? new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
function status(msg, bad) { const el = $("status"); el.textContent = msg; el.style.color = bad ? "var(--bad)" : ""; }
function backup(key, value) { try { localStorage.setItem("cw-review-" + key, JSON.stringify(value)); } catch (e) { /* storage may be blocked */ } }

function md(text) {
  // Minimal markdown: escape first, then bold, bullet lists, paragraphs.
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (line.trim()) out += `<p>${line}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Read-modify-write against the latest server copy, so suggestions the coding
// agent writes while this page is open are never overwritten by a stale tab.
async function mutate(name, fn) {
  const fresh = await api("/api/state");
  const data = fresh[name];
  fn(data);
  await api("/api/" + name, data);
  applyState({ ...fresh, [name]: data });
  backup(name, data);
}

function applyState(st) {
  S.annotations = (st.annotations && st.annotations.annotations) || [];
  S.patterns = st.patterns && Array.isArray(st.patterns.modes) ? st.patterns : { modes: [] };
  S.suggestions = Array.isArray(st.suggestions) ? st.suggestions : [];
  S.manifest = st.manifest || {};
  S.labels = st.labels || {};
  S.drafts = (st.drafts && st.drafts.drafts) || {};
  S.langfuse = !!st.langfuse;
}

/* ---------- review set and batches ---------- */
function batches() { return (S.manifest.batches || []); }
function batchOf(scenarioId) {
  for (const b of batches()) for (const it of b.items || []) if (it.scenario_id === scenarioId) return { batch: b, item: it };
  return null;
}
function reviewSet() {
  const ids = []; for (const b of batches()) for (const it of b.items || []) ids.push(it.scenario_id);
  return ids;
}
function buildList() {
  let ids;
  if (S.batch === "all") ids = S.sessions.map((s) => s.scenario_id);
  else if (S.batch === "review") ids = reviewSet();
  else ids = ((batches().find((b) => b.id === S.batch) || {}).items || []).map((it) => it.scenario_id);
  S.list = ids.filter((id) => S.byScenario[id]);
}
function renderBatchSel() {
  const sel = $("batchsel");
  const opts = [["review", `Review set (${reviewSet().length})`], ...batches().map((b) => [b.id, `${b.id}: ${b.name} (${(b.items || []).length})`]), ["all", `All sessions (${S.sessions.length}), browse only`]];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}"${v === S.batch ? " selected" : ""}>${esc(l)}</option>`).join("");
}

/* ---------- annotations ---------- */
const active = (a) => a.status !== "retracted";
function sessionNotes(sessionId) { return S.annotations.filter((a) => a.session_id === sessionId && active(a)); }
// Any active note counts: a session re-coded to spec gap or close negative was still read.
function isReviewed(sessionId) { return sessionNotes(sessionId).some((a) => active(a) && (a.kind === "no_failure" || a.kind === "open_code")); }
function hasFirstFailure(sessionId) { return sessionNotes(sessionId).some((a) => a.first_failure); }

/* ---------- review view ---------- */
function curSession() { return S.byScenario[S.list[S.cur]]; }

const countRole = (s, role) => s.turns.reduce((n, t) => n + t.messages.filter((m) => m.role === role).length, 0);

function renderHeader(s) {
  const t = s.tuple || {};
  const b = batchOf(s.scenario_id);
  const dims = ["intent", "record_state", "applicable_policy", "tools_needed", "difficulty", "user_style"]
    .filter((k) => t[k]).map((k) => `<span class="chip" title="${k}">${esc(t[k])}</span>`).join("");
  const badges = s.badges.map((x) => `<span class="badge${["TOOL ERROR", "EMPTY RESULT"].includes(x) ? " bad" : ""}">${esc(x)}</span>`).join(" ");
  const reviewed = isReviewed(s.session_id) ? `<span class="badge done">REVIEWED</span>` : `<span class="badge">NOT REVIEWED</span>`;
  const exp = s.expected || {};
  $("shead").innerHTML = `
    <div class="row">
      <span class="sid">${esc(s.scenario_id)}</span>
      <span class="chip role">${esc(s.role)}</span>
      <span class="chip">user ${esc(t.user_id ?? "?")}</span>
      ${t.store_id != null ? `<span class="chip">store ${esc(t.store_id)}</span>` : ""}
      ${t.order_id != null ? `<span class="chip">order ${esc(t.order_id)}</span>` : ""}
      <span class="chip">${esc(s.scenario_group)}${s.data_quality_case_id ? " · " + esc(s.data_quality_case_id) : ""}</span>
      ${reviewed}
      <span class="spacer"></span>
      <span class="dim mono">${S.cur + 1} / ${S.list.length}</span>
    </div>
    <div class="row">${dims}</div>
    <div class="row dim">${s.n_turns} turn${s.n_turns > 1 ? "s" : ""} · ${countRole(s, "user")} user · ${countRole(s, "assistant")} agent · ${s.n_tool_calls} tool calls ·
      ${fmtTime(s.start)} → ${fmtTime(s.end)} (${s.duration_s}s) · ${badges}</div>
    ${b ? `<div class="row dim">batch <b>${esc(b.batch.id)}</b> · ${esc(b.item.reason || b.batch.method || "")}</div>` : `<div class="row dim">not in the review set (browse only)</div>`}
    <div class="row" style="margin-top:4px">
      <button id="btn-reveal">${S.reveal ? "Hide" : "Reveal"} expected outcome</button>
      <button id="btn-guide">Tool guidance</button>
    </div>
    ${S.reveal ? `<div class="expected"><b>${esc(exp.outcome || "")}</b> <span class="dim">(${esc(exp.evaluation || "")})</span><br>${esc(exp.reason || "")}<br><span class="dim mono">${esc(JSON.stringify(exp.source || ""))}</span></div>` : ""}`;
  $("btn-reveal").onclick = () => { S.reveal = !S.reveal; renderReview(); };
  $("btn-guide").onclick = showGuidance;
}

function resultSummary(content) {
  if (content == null || typeof content !== "object") return esc(String(content ?? ""));
  const parts = [];
  if ("ok" in content) parts.push(content.ok ? `<b style="color:var(--ok)">ok</b>` : `<b style="color:var(--bad)">ok: false</b>`);
  for (const [k, v] of Object.entries(content)) {
    if (k === "ok") continue;
    if (Array.isArray(v)) parts.push(`<span class="k">${esc(k)}:</span> ${v.length === 0 ? `<b style="color:var(--bad)">[] empty</b>` : v.length + " item" + (v.length > 1 ? "s" : "")}`);
    else if (v !== null && typeof v === "object") parts.push(`<span class="k">${esc(k)}:</span> {…}`);
    else parts.push(`<span class="k">${esc(k)}:</span> ${esc(String(v)).slice(0, 140)}`);
    if (parts.length >= 7) break;
  }
  return parts.join(" · ");
}

function policyRefs(obj) {
  const found = new Set();
  const text = JSON.stringify(obj || "");
  for (const m of text.matchAll(/\b(?:cw|store)-[a-z0-9-]+/g)) if (S.policies.has(m[0])) found.add(m[0]);
  return [...found];
}

function msgClasses(turnIdx, idx) {
  const s = curSession();
  const notes = sessionNotes(s.session_id).filter((a) => a.turn === turnIdx && a.msg_index === idx);
  if (notes.some((a) => a.first_failure)) return " first-fail";
  return notes.length ? " has-note" : "";
}

function renderMessages(turn, turnIdx) {
  const msgs = turn.messages, used = new Set(), out = [];
  msgs.forEach((m, i) => {
    if (used.has(i)) return;
    const attrs = `data-turn="${turnIdx}" data-idx="${i}"`;
    const add = `<button class="addnote" data-turn="${turnIdx}" data-idx="${i}">+ note</button>`;
    if (m.role === "user" || m.role === "assistant") {
      const who = m.role === "user" ? "user" : "agent";
      out.push(`<div class="msg ${who}${msgClasses(turnIdx, i)}" ${attrs}>${add}<div class="who">${who.toUpperCase()}</div>
        <div class="annotatable ${who === "agent" ? "agent-text" : ""}" ${attrs}>${who === "agent" ? md(m.text) : esc(m.text).replace(/\n/g, "<br>")}</div></div>`);
      return;
    }
    // Pair a tool call with the next result of the same tool.
    let call = null, result = null;
    if (m.role === "tool_call") {
      call = m;
      for (let j = i + 1; j < msgs.length; j++) if (!used.has(j) && msgs[j].role === "tool_result" && msgs[j].name === m.name) { result = msgs[j]; used.add(j); break; }
    } else result = m;
    const content = result ? result.content : undefined;
    const err = content && typeof content === "object" && content.ok === false;
    const args = call ? JSON.stringify(call.arguments ?? {}) : "";
    const full = result ? JSON.stringify(content, null, 2) : "(no result recorded)";
    const long = full.split("\n").length > 14;
    const refs = policyRefs(content);
    out.push(`<div class="msg tool${err ? " err" : ""}${msgClasses(turnIdx, i)}" ${attrs}>${add}
      <div class="who">TOOL · ${esc((call || result).name)}</div>
      <div class="annotatable" ${attrs}>
        ${call ? `<div class="tsum"><span class="k">args</span> ${esc(args)}</div>` : ""}
        <div class="tsum"><span class="k">→</span> ${result ? resultSummary(content) : "<i>no result</i>"}</div>
        ${long ? `<details><summary>full result (${full.split("\n").length} lines)</summary><pre>${esc(full)}</pre></details>` : `<pre style="margin-top:4px">${esc(full)}</pre>`}
      </div>

    </div>`);
  });
  return out.join("");
}

function flashMsg(a) {

function openComposer(turn, idx, quote) { S.composer = { turn, idx, quote }; renderComposer(); $("cmp-note").focus(); }
function renderComposer() {
  const c = S.composer, s = curSession();
  if (!c || !s) { $("composer").innerHTML = ""; return; }
  const ff = c.editing ? !!c.firstFailure : !hasFirstFailure(s.session_id);
  $("composer").innerHTML = `<div class="composer" style="margin-top:8px">
    <div class="dim" style="font-size:11px">${c.editing ? "editing note (the earlier text is kept in history)" : `new note · turn ${c.turn + 1} · msg ${c.idx}`}</div>
    ${c.quote ? `<div class="q dim" style="font-style:italic;font-size:12px">“${esc(c.quote)}”</div>` : ""}
    <textarea id="cmp-note" rows="4" placeholder="Describe what went wrong, specifically, in your own words">${esc(c.text || "")}</textarea>
    <label><input type="checkbox" id="cmp-ff" ${ff && !c.specGap ? "checked" : ""}> this is the first failure in the session</label>
    <label><input type="checkbox" id="cmp-gap" ${c.specGap ? "checked" : ""}> possible spec gap (desirable, but not required by SPEC.md; not a failure)</label>
    <div style="display:flex;gap:6px"><button class="primary" id="cmp-save">Save</button><button id="cmp-cancel">Cancel</button></div></div>`;
  // A spec gap is not a failure, so the two flags exclude each other.
  $("cmp-ff").onchange = () => { if ($("cmp-ff").checked) $("cmp-gap").checked = false; };
  $("cmp-gap").onchange = () => { if ($("cmp-gap").checked) $("cmp-ff").checked = false; };
  $("cmp-save").onclick = saveComposer;
  $("cmp-cancel").onclick = () => { S.composer = null; renderComposer(); };
}

async function saveComposer() {
  const c = S.composer, s = curSession();
  const text = $("cmp-note").value.trim();
  if (!text) return;
  const ff = $("cmp-ff").checked, gap = $("cmp-gap").checked;
  // One first failure per session: ticking it here clears it elsewhere.
  const clearOthers = (d, keepId) => {
    for (const x of d.annotations) if (x.session_id === s.session_id && x.id !== keepId && x.first_failure && active(x)) {
      x.history = [...(x.history || []), { note: x.note, first_failure: true, ts: x.edited_at || x.ts }];
      x.first_failure = false; x.edited_at = now();
    }
  };
  if (c.editing) {
    await mutate("annotations", (d) => {
      const a = d.annotations.find((x) => x.id === c.editing);
      if (a.note === text && a.first_failure === ff && !!a.spec_gap === gap) return;
      a.history = [...(a.history || []), { note: a.note, first_failure: a.first_failure, spec_gap: !!a.spec_gap, ts: a.edited_at || a.ts }];
      a.note = text; a.first_failure = ff; a.spec_gap = gap; a.edited_at = now();
      if (ff) clearOthers(d, a.id);
    });
  } else {
    const b = batchOf(s.scenario_id);
    const ann = {
      id: newId("ann"), kind: "open_code", author: "human", ts: now(),
      session_id: s.session_id, scenario_id: s.scenario_id, trace_id: s.turns[c.turn].trace_id,
      turn: c.turn, msg_index: c.idx, quote: c.quote || "", note: text, first_failure: !!ff, spec_gap: gap,
      batch: b ? b.batch.id : null, status: "active", history: [],
    };
    await mutate("annotations", (d) => { if (ff) clearOthers(d, ann.id); d.annotations.push(ann); });
  }
  S.composer = null; status("note saved"); renderReview();
}

function editNote(a) { S.composer = { turn: a.turn, idx: a.msg_index, quote: a.quote, text: a.note, editing: a.id, firstFailure: a.first_failure, specGap: !!a.spec_gap }; renderComposer(); }
async function retractNote(a) {
  const why = prompt("Retract this note? It stays in the saved history. Reason (optional):", "");
  if (why === null) return;
  await mutate("annotations", (d) => { const x = d.annotations.find((y) => y.id === a.id); x.status = "retracted"; x.retracted_at = now(); x.retract_reason = why; });
  renderReview();
}
async function noFailure() {
  const s = curSession(), b = batchOf(s.scenario_id);
  await mutate("annotations", (d) => d.annotations.push({
    id: newId("ann"), kind: "no_failure", author: "human", ts: now(), session_id: s.session_id, scenario_id: s.scenario_id,
    trace_id: s.turns[s.turns.length - 1].trace_id, trace_ids: s.turns.map((t) => t.trace_id),
    note: "no failure observed", first_failure: false, batch: b ? b.batch.id : null, status: "active", history: [],
  }));
  status("marked: no failure observed"); renderReview();
}

/* ---------- suggestions ---------- */
function sessionSuggestions(s) {
  const traces = new Set(s.turns.map((t) => t.trace_id));
  return S.suggestions.filter((g) => g.session_id === s.session_id || traces.has(g.trace_id) || g.scenario_id === s.scenario_id);
}
function renderSuggestions() {
  const s = curSession();
  const list = sessionSuggestions(s);
  $("suggs").innerHTML = list.length ? list.map((g) => `
    <div class="sugg" data-id="${g.id}">
      <div class="src">AI · ${esc(g.kind || "suggestion")}${g.mode ? " · " + esc(g.mode) : ""} · ${esc(g.status || "pending")}</div>
      <div>${esc(g.note)}</div>
      ${g.signal ? `<div class="dim" style="font-size:12px">signal: ${esc(g.signal)}</div>` : ""}
      ${g.decision_note ? `<div class="dim" style="font-size:12px">your decision: ${esc(g.decision_note)}</div>` : ""}
      ${(g.status || "pending") === "pending" ? `<div class="acts" style="display:flex;gap:6px;margin-top:4px"><input class="why" style="flex:1" placeholder="Why? (required to reject: the boundary or evidence that excludes it)"><button data-act="accept">Accept</button><button data-act="reject">Reject</button></div>` : ""}
    </div>`).join("") : `<div class="dim">None for this session.</div>`;
  document.querySelectorAll("#suggs .sugg").forEach((el) => {
    const id = el.dataset.id;
    const acc = el.querySelector('[data-act="accept"]'), rej = el.querySelector('[data-act="reject"]');
    const why = () => el.querySelector(".why").value.trim();
    if (acc) acc.onclick = () => decide(id, true, why());
    if (rej) rej.onclick = () => decide(id, false, why());
  });
}
// Reason comes from an inline box, not prompt(): embedded browsers (e.g. VS Code's) block dialogs.
async function decide(id, accept, why) {
  if (!accept && !why) { status("Reject needs a reason: which boundary or evidence excludes it?", true); return; }
  const g = S.suggestions.find((x) => x.id === id);
  await mutate("suggestions", (d) => { const x = d.find((y) => y.id === id); x.status = accept ? "accepted" : "rejected"; x.decided_at = now(); x.decision_note = why; x.decided_by = "human"; });
  if (accept && g.kind === "open_code") {
    const s = curSession();
    const turn = Math.max(0, s.turns.findIndex((t) => t.trace_id === g.trace_id));
    await mutate("annotations", (d) => d.annotations.push({
      id: newId("ann"), kind: "open_code", author: "human", from_suggestion: g.id, ts: now(),
      session_id: s.session_id, scenario_id: s.scenario_id, trace_id: s.turns[turn].trace_id, turn, msg_index: g.msg_index ?? 0,
      quote: g.quote || "", note: g.note + (why ? " [accepted: " + why + "]" : ""), first_failure: false,
      batch: (batchOf(s.scenario_id) || { batch: {} }).batch.id || null, status: "active", history: [],
    }));
  }
  if (accept && g.kind === "search_hit" && g.mode) {
    await mutate("patterns", (d) => { const m = d.modes.find((x) => x.name === g.mode); if (m && !m.example_trace_ids.includes(g.trace_id)) m.example_trace_ids.push(g.trace_id); });
  }
  status(accept ? "suggestion accepted" : "suggestion rejected"); render();
}

/* ---------- taxonomy view ---------- */
const MODE_FIELDS = ["name", "status", "evaluator_type", "requirement_source", "definition", "boundary", "nearest_mode"];
function blankMode() {
  return { name: "", status: "candidate", evaluator_type: "llm_judge", requirement_source: "", definition: "", boundary: "", nearest_mode: "",
    annotation_ids: [], example_trace_ids: [], close_negative_trace_ids: [], history: [], created_at: now() };
}
function traceChip(tid, mode, field) {
  const s = S.byTrace[tid];
  const label = s ? `${s.session.scenario_id}·t${s.turn + 1}` : tid.slice(0, 8);
  return `<span class="tchip"><a class="lnk" data-goto="${esc(s ? s.session.scenario_id : "")}">${esc(label)}</a>${mode ? `<button data-rm="${esc(tid)}" data-mode="${esc(mode)}" data-field="${field}">×</button>` : ""}</span>`;
}
function renderTaxonomy() {
  const modes = S.patterns.modes;
  const codes = S.annotations.filter((a) => a.kind === "open_code" && active(a));
  const assigned = new Set(modes.flatMap((m) => m.annotation_ids || []));
  const shown = codes.filter((a) => S.codeFilter === "all"
    || (S.codeFilter === "gaps" ? a.spec_gap : !a.spec_gap && !assigned.has(a.id)));
  const modeCards = modes.map((m, mi) => `
    <div class="mode${m.status === "rejected" || m.status === "merged" ? " rejected" : ""}" data-mi="${mi}">
      <div class="grid">
        <label>name</label><input data-f="name" value="${esc(m.name)}" placeholder="snake_case_name">
        <label>status</label><select data-f="status">${["candidate", "confirmed", "merged", "rejected"].map((x) => `<option${m.status === x ? " selected" : ""}>${x}</option>`).join("")}</select>
        <label>evaluator</label><select data-f="evaluator_type">${["llm_judge", "code"].map((x) => `<option${m.evaluator_type === x ? " selected" : ""}>${x}</option>`).join("")}</select>
        <label>requirement</label><input data-f="requirement_source" value="${esc(m.requirement_source)}" placeholder="SPEC.md id, e.g. RESP-2, or 'SPEC revision: …'">
        <label>definition</label><textarea data-f="definition" rows="3" placeholder="Fail when … ; Pass when …">${esc(m.definition)}</textarea>
        <label>boundary</label><textarea data-f="boundary" rows="2" placeholder="How this differs from its nearest neighbor">${esc(m.boundary)}</textarea>
        <label>nearest mode</label><select data-f="nearest_mode"><option value=""></option>${modes.filter((x) => x !== m).map((x) => `<option${m.nearest_mode === x.name ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
        <label>positives (${m.example_trace_ids.length})</label><div>${m.example_trace_ids.map((t) => traceChip(t, m.name, "example_trace_ids")).join("")}
          <input data-add="example_trace_ids" placeholder="+ trace id or support-0001" size="20"></div>
        <label>close negatives (${m.close_negative_trace_ids.length})</label><div>${m.close_negative_trace_ids.map((t) => traceChip(t, m.name, "close_negative_trace_ids")).join("")}
          <input data-add="close_negative_trace_ids" placeholder="+ trace id or support-0001" size="20"></div>
        <label>supporting notes (${(m.annotation_ids || []).length})</label><div>${(m.annotation_ids || []).map((id) => { const a = S.annotations.find((x) => x.id === id); return a ? `<div class="note" style="cursor:default"><span class="dim mono">${esc(a.scenario_id)}</span> ${esc(a.note)}</div>` : ""; }).join("") || '<span class="dim">assign open codes from the right-hand list</span>'}</div>
        <label>revisions (${m.history.length})</label><div>${m.history.map((h) => `<div class="dim" style="font-size:12px">${fmtTime(h.ts)} · ${h.field ? `${esc(h.field)}: “${esc(h.from)}” → “${esc(h.to)}”${h.reason ? " · because " + esc(h.reason) : ""}` : `${esc(h.action)}: ${esc(h.note)}`}</div>`).join("") || '<span class="dim">none yet</span>'}</div>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px"><button class="primary" data-save="${mi}">Save mode</button></div>
    </div>`).join("");
  $("taxpage").innerHTML = `<div class="tax">
    <div><div style="display:flex;justify-content:space-between;align-items:center"><h2>Failure modes (${modes.filter((m) => m.status !== "rejected" && m.status !== "merged").length} active)</h2><button id="addmode">+ New mode</button></div>
      ${modeCards || '<p class="dim">No modes yet. Axial coding starts after the first review batch: group open codes that one product change would fix.</p>'}</div>
    <div><div style="display:flex;justify-content:space-between;align-items:center"><h2>Open codes (${shown.length} of ${codes.length})</h2>
      <select id="codefilter"><option value="unassigned"${S.codeFilter === "unassigned" ? " selected" : ""}>unassigned failures</option><option value="gaps"${S.codeFilter === "gaps" ? " selected" : ""}>spec gaps</option><option value="all"${S.codeFilter === "all" ? " selected" : ""}>all</option></select></div>
      ${shown.map((a) => `<div class="code"><div class="meta"><a class="lnk" data-goto="${esc(a.scenario_id)}">${esc(a.scenario_id)}</a> · turn ${(a.turn ?? 0) + 1} · ${esc(a.batch || "")}${a.first_failure ? " · first failure" : ""}${a.spec_gap ? " · <b style='color:var(--warn)'>spec gap</b>" : ""}</div>

  }).then(renderTaxonomy));
  document.querySelectorAll("#taxpage [data-rm]").forEach((b) => b.onclick = () => mutate("patterns", (d) => {
    const m = d.modes.find((x) => x.name === b.dataset.mode); m[b.dataset.field] = m[b.dataset.field].filter((t) => t !== b.dataset.rm);
  }).then(renderTaxonomy));
  document.querySelectorAll("#taxpage [data-add]").forEach((inp) => inp.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const mi = +inp.closest(".mode").dataset.mi, v = inp.value.trim();
    const sess = S.byScenario[v];
    const tids = sess ? sess.turns.map((t) => t.trace_id) : (S.byTrace[v] ? [v] : []);
    if (!tids.length) { status("unknown trace or scenario id: " + v, true); return; }
    if (sess && tids.length > 1) { status(`${v} has ${tids.length} turns; enter the specific trace id from the Label view`, true); return; }
    mutate("patterns", (d) => { const m = d.modes[mi]; for (const t of tids) if (!m[inp.dataset.add].includes(t)) m[inp.dataset.add].push(t); }).then(renderTaxonomy);
  });
}
async function saveMode(mi) {
  const card = document.querySelector(`.mode[data-mi="${mi}"]`);
  const vals = {}; card.querySelectorAll("[data-f]").forEach((el) => vals[el.dataset.f] = el.value.trim());
  if (!/^[a-z][a-z0-9_]*$/.test(vals.name)) { status("mode name must be snake_case", true); return; }
  if (S.patterns.modes.some((m, i) => i !== mi && m.name === vals.name)) { status("another mode already has that name", true); return; }
  const old = S.patterns.modes[mi];
  const changed = ["name", "definition", "boundary", "status"].filter((f) => old[f] && old[f] !== vals[f]);
  let reason = "";
  if (changed.length) { reason = prompt(`You changed ${changed.join(", ")}. Why? (recorded as a taxonomy revision)`, ""); if (reason === null) return; }
  const oldName = old.name;
  await mutate("patterns", (d) => {
    const m = d.modes[mi];
    for (const f of changed) m.history.push({ ts: now(), field: f, from: m[f], to: vals[f], reason });
    for (const f of MODE_FIELDS) m[f] = vals[f];
    m.updated_at = now();
    if (oldName && oldName !== vals.name) for (const x of d.modes) if (x.nearest_mode === oldName) x.nearest_mode = vals.name;
  });
  if (oldName && oldName !== vals.name && Object.keys(S.labels[oldName] || {}).length) status(`renamed; existing labels stay in labels/${oldName}.jsonl, relabel or move them`, true);
  else status("mode saved");
  renderTaxonomy();
}

/* ---------- label view ---------- */
// Final modes only; merged and rejected modes keep their history but get no labels.
function labelModes() { return S.patterns.modes.filter((m) => m.name && (m.status === "candidate" || m.status === "confirmed")); }
S.pending = {};  // trace_id -> {mode: 0|1}, unsaved flips
function cellValue(mode, tid) {
  const p = (S.pending[tid] || {})[mode]; if (p !== undefined) return { v: p, state: "pending" };
  const cur = (S.labels[mode] || {})[tid]; if (cur) return { v: cur.label, state: "saved" };
  const d = (S.drafts[mode] || {})[tid]; return { v: d ? d.label : 0, state: "draft", basis: d ? d.basis : "unchecked" };
}
function rowSaved(tid, modes) { return modes.every((m) => (S.labels[m.name] || {})[tid] && cellValue(m.name, tid).state === "saved"); }
function renderLabel() {
  const modes = labelModes();
  const sessions = reviewSet().map((id) => S.byScenario[id]).filter(Boolean);
  if (!modes.length || !sessions.length) { $("labelpage").innerHTML = `<p class="dim">Labeling needs at least one mode (Taxonomy) and a review set (sample manifest).</p>`; return; }
  let rows = "";
  for (const s of sessions) {
    const turns = s.turns.map((t, i) => ({ t, i })).filter(({ t }) => S.labelFilter === "all" || !rowSaved(t.trace_id, modes));
    if (!turns.length) continue;
    rows += `<tr class="sess"><td colspan="${modes.length + 2}"><a class="lnk" href="/#${esc(s.scenario_id)}" target="_blank">${esc(s.scenario_id)} ↗</a> <span class="dim">${esc(s.role)} · ${s.n_turns} turn(s) · ${esc((batchOf(s.scenario_id) || { batch: {} }).batch.id || "")}</span></td></tr>`;
    for (const { t, i } of turns) {
      const tid = t.trace_id, saved = rowSaved(tid, modes);
      rows += `<tr><td class="mono">turn ${i + 1} · ${tid.slice(0, 8)}</td>${modes.map((m) => {
        const c = cellValue(m.name, tid), cur = (S.labels[m.name] || {})[tid], d = (S.drafts[m.name] || {})[tid];
        const ev = (cur && cur.evidence) || (d && d.evidence) || "";
        const tip = c.state === "draft" ? `draft (${c.basis})${ev ? ": " + ev : ""}` : c.state === "pending" ? "changed, not saved" : `saved${ev ? ": " + ev : ""}`;
        const sync = cur ? (cur.langfuse === "ok" ? `<span class="sync ok" title="written to Langfuse">●</span>` : `<span class="sync local" title="${esc(cur.langfuse || "local only")}">●</span>`) : "";
        const style = c.state === "saved" ? "" : "border-style:dashed;" + (c.state === "pending" ? "outline:2px solid var(--accent, #36c);" : "opacity:.55;");
        const marker = c.state === "draft" && c.basis !== "unchecked" ? "*" : "";
        return `<td class="cell" title="${esc(tip)}"><button class="${c.v === 1 ? "fail" : "pass"}" style="${style}" data-flip="${esc(m.name)}" data-t="${tid}">${c.v === 1 ? "Fail" : "Pass"}${marker}</button> ${sync}</td>`;
      }).join("")}<td style="white-space:nowrap"><input class="rowev" data-t="${tid}" placeholder="evidence for any Fail you flip" style="width:200px">
        <button data-save="${tid}">${saved ? "Saved ✓" : "Save row"}</button></td></tr>`;
    }
  }
  const allTids = sessions.flatMap((s) => s.turns.map((t) => t.trace_id));
  const done = allTids.filter((tid) => rowSaved(tid, modes)).length;
  $("labelpage").innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <b>${done} / ${allTids.length}</b><span class="dim">traces saved (${modes.length} judgments each) · dashed = draft, not yet a label · * = drafted from your notes · click a cell to flip · Fail = failure present (1) · Langfuse sync ${S.langfuse ? "on" : "<b style='color:var(--bad)'>OFF</b>"}</span>
      <span class="spacer"></span><select id="labelfilter"><option value="incomplete">unsaved only</option><option value="all"${S.labelFilter === "all" ? " selected" : ""}>all traces</option></select></div>
    <table><thead><tr><th>trace</th>${modes.map((m) => `<th title="${esc(m.definition + "\n\nBoundary: " + m.boundary)}">${esc(m.name)}</th>`).join("")}<th></th></tr></thead><tbody>${rows}</tbody></table>`;
  $("labelfilter").onchange = (e) => { S.labelFilter = e.target.value; renderLabel(); };
  document.querySelectorAll("#labelpage [data-flip]").forEach((b) => b.onclick = () => {
    const tid = b.dataset.t, mode = b.dataset.flip;
    S.pending[tid] = S.pending[tid] || {}; S.pending[tid][mode] = cellValue(mode, tid).v === 1 ? 0 : 1;
    const cur = (S.labels[mode] || {})[tid];
    if (cur && cur.label === S.pending[tid][mode]) delete S.pending[tid][mode];  // flipped back to the saved value
    renderLabel();
  });
  document.querySelectorAll("#labelpage [data-save]").forEach((b) => b.onclick = () => saveRow(b.dataset.save));
}
// Writes every mode for one trace; unchanged saved labels are skipped. Evidence
// for a Fail comes from the draft (your note) unless you flipped it, then from the row box.
async function saveRow(tid) {
  const modes = labelModes(), sess = S.byTrace[tid].session;
  const rowEv = (document.querySelector(`.rowev[data-t="${tid}"]`) || {}).value || "";
  const writes = [];
  for (const m of modes) {
    const c = cellValue(m.name, tid), cur = (S.labels[m.name] || {})[tid], d = (S.drafts[m.name] || {})[tid];
    if (cur && cur.label === c.v && c.state === "saved") continue;
    const fromDraft = d && d.label === c.v ? d.evidence : "";
    const evidence = (c.state === "pending" ? rowEv.trim() : "") || fromDraft || (cur && cur.label === c.v ? cur.evidence : "");
    if (c.v === 1 && !evidence) { status(`${m.name} is Fail: add evidence in the row box (the reply text or tool result)`, true); return; }
    writes.push({ mode: m.name, label: c.v, evidence });
  }
  try {
    let lf = "ok";
    for (const w of writes) {
      const rec = await api("/api/label", { ...w, trace_id: tid, session_id: sess.session_id, scenario_id: sess.scenario_id });
      S.labels[w.mode] = S.labels[w.mode] || {}; S.labels[w.mode][tid] = rec;
      if (rec.langfuse !== "ok") lf = rec.langfuse;
    }
    delete S.pending[tid];
    status(`${tid.slice(0, 8)}: ${writes.length} label(s) saved` + (lf === "ok" ? " + Langfuse scores" : "; Langfuse: " + lf), lf !== "ok");
  } catch (e) { status(e.message, true); }
  renderLabel();
}
/* ---------- progress view ---------- */
function renderProgress() {
  const rs = reviewSet(), sessions = rs.map((id) => S.byScenario[id]).filter(Boolean);
  const traces = sessions.reduce((n, s) => n + s.turns.length, 0);
  const reviewed = sessions.filter((s) => isReviewed(s.session_id));
  const codes = S.annotations.filter((a) => a.kind === "open_code" && active(a));
  const nofail = S.annotations.filter((a) => a.kind === "no_failure" && active(a));
  const modes = labelModes();
  const rsTraces = new Set(sessions.flatMap((s) => s.turns.map((t) => t.trace_id)));
  const batchRows = batches().map((b) => {
    const ss = (b.items || []).map((it) => S.byScenario[it.scenario_id]).filter(Boolean);
    const ids = new Set(ss.map((s) => s.session_id));
    return `<tr><td><b>${esc(b.id)}</b></td><td>${esc(b.name)}</td><td>${esc(b.method || "")}</td><td>${ss.length}</td><td>${ss.reduce((n, s) => n + s.turns.length, 0)}</td>
      <td>${ss.filter((s) => isReviewed(s.session_id)).length}</td><td>${codes.filter((a) => ids.has(a.session_id) && a.first_failure).length}</td><td>${nofail.filter((a) => ids.has(a.session_id)).length}</td></tr>`;
  }).join("");
  const modeRows = modes.map((m) => {
    const live = Object.values(S.labels[m.name] || {}).filter((r) => rsTraces.has(r.trace_id));
    const fail = live.filter((r) => r.label === 1).length, pass = live.filter((r) => r.label === 0).length;
    return `<tr><td>${esc(m.name)}</td><td>${esc(m.status)}</td><td>${fail}</td><td>${pass}</td><td>${traces - fail - pass}</td>
      <td>${fail + pass ? (fail / (fail + pass) * 100).toFixed(1) + "%" : "–"}</td><td>${m.example_trace_ids.length} / ${m.close_negative_trace_ids.length}</td></tr>`;
  }).join("");
  const unreviewed = sessions.filter((s) => !isReviewed(s.session_id));
  const incomplete = sessions.flatMap((s) => s.turns.map((t, i) => ({ s, t, i, n: modes.filter((m) => !(S.labels[m.name] || {})[t.trace_id]).length }))).filter((x) => x.n);
  const sg = (st) => S.suggestions.filter((g) => (g.status || "pending") === st);
  $("progpage").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="v">${traces}</div><div class="l">traces in review set (${sessions.length} sessions)</div></div>
      <div class="kpi"><div class="v">${reviewed.reduce((n, s) => n + s.turns.length, 0)}</div><div class="l">traces open-coded (${reviewed.length} sessions)</div></div>
      <div class="kpi"><div class="v">${codes.filter((a) => !a.spec_gap).length}</div><div class="l">open codes</div></div>
      <div class="kpi"><div class="v">${codes.filter((a) => a.spec_gap).length}</div><div class="l">possible spec gaps</div></div>
      <div class="kpi"><div class="v">${nofail.length}</div><div class="l">no failure observed</div></div>
      <div class="kpi"><div class="v">${modes.length}</div><div class="l">active modes</div></div>
      <div class="kpi"><div class="v">${sg("pending").length} / ${sg("accepted").length} / ${sg("rejected").length}</div><div class="l">suggestions pending / accepted / rejected</div></div>
    </div>
    <h2>Batches</h2>
    <table><thead><tr><th>id</th><th>name</th><th>method</th><th>sessions</th><th>traces</th><th>reviewed</th><th>first failures</th><th>no failure</th></tr></thead><tbody>${batchRows || '<tr><td colspan="8" class="dim">no batches yet</td></tr>'}</tbody></table>
    <h2>Modes (sample fractions of labeled review-set traces, not prevalence)</h2>
    <table><thead><tr><th>mode</th><th>status</th><th>Fail</th><th>Pass</th><th>unlabeled</th><th>sample fraction</th><th>positives / close negatives</th></tr></thead><tbody>${modeRows || '<tr><td colspan="7" class="dim">no modes yet</td></tr>'}</tbody></table>
    <h2>Not yet open-coded (${unreviewed.length})</h2>
    <div>${unreviewed.map((s) => `<span class="tchip"><a class="lnk" data-goto="${esc(s.scenario_id)}">${esc(s.scenario_id)}</a></span>`).join("") || '<span class="dim">none</span>'}</div>
    <h2>Incomplete judgments (${incomplete.reduce((n, x) => n + x.n, 0)} trace × mode pairs)</h2>
    <div>${incomplete.slice(0, 200).map((x) => `<span class="tchip"><a class="lnk" data-goto="${esc(x.s.scenario_id)}">${esc(x.s.scenario_id)}·t${x.i + 1}</a> <span class="dim">${x.n}</span></span>`).join("") || '<span class="dim">none</span>'}</div>
    <h2>Pending AI suggestions (${sg("pending").length})</h2>
    <div>${sg("pending").map((g) => `<div class="sugg"><div class="src">AI · ${esc(g.kind || "")}${g.mode ? " · " + esc(g.mode) : ""} · <a class="lnk" data-goto="${esc(g.scenario_id || (S.byTrace[g.trace_id] || { session: {} }).session.scenario_id || "")}">${esc(g.scenario_id || g.trace_id || "")}</a></div>${esc(g.note)}</div>`).join("") || '<span class="dim">none</span>'}</div>`;
  document.querySelectorAll("#progpage [data-goto]").forEach((a) => a.onclick = () => gotoScenario(a.dataset.goto));
}

/* ---------- navigation ---------- */
function go(i) {
  if (!S.list.length) return;
  S.cur = (i + S.list.length) % S.list.length; S.composer = null; S.reveal = false;
  window.scrollTo(0, 0); renderReview();
}
function gotoScenario(id) {
  if (!S.byScenario[id]) { status("unknown scenario " + id, true); return; }
  buildList();
  if (!S.list.includes(id)) { S.batch = "all"; buildList(); renderBatchSel(); }
  S.cur = S.list.indexOf(id); switchView("review"); go(S.cur);
}
function switchView(v) {
  S.view = v;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
  document.querySelectorAll(".view").forEach((el) => el.classList.toggle("active", el.id === "v-" + v));
  render();
}
function render() {
  if (S.view === "review") renderReview();
  else if (S.view === "taxonomy") renderTaxonomy();
  else if (S.view === "label") renderLabel();
  else renderProgress();
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => switchView(b.dataset.view));
$("batchsel").onchange = (e) => { S.batch = e.target.value; buildList(); S.cur = 0; go(0); };
$("jump").onkeydown = (e) => { if (e.key === "Enter") gotoScenario(e.target.value.trim()); };
// Sticky table headers sit just below the top bar, whose height changes when it wraps.
const topBar = document.querySelector("header.top");
new ResizeObserver(() => document.documentElement.style.setProperty("--top-h", topBar.offsetHeight + "px")).observe(topBar);
// Deep link: http://localhost:8020/#support-0140 opens that session.
window.addEventListener("hashchange", () => gotoScenario(decodeURIComponent(location.hash.slice(1))));
document.addEventListener("keydown", (e) => {
  if (S.view !== "review" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "j") go(S.cur + 1);
  if (e.key === "ArrowLeft" || e.key === "k") go(S.cur - 1);
});

// Pick up suggestions or batches the coding agent writes while the page is open.
setInterval(async () => {
  if (S.composer || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  try {
    const st = await api("/api/state");
    const before = JSON.stringify([S.suggestions, S.manifest]);
    applyState(st);
    if (JSON.stringify([S.suggestions, S.manifest]) !== before) { renderBatchSel(); buildList(); render(); status("new suggestions or batches loaded"); }
  } catch (e) { /* server restarting */ }
}, 15000);

async function init() {
  try {
    const [cache, st, prompt] = await Promise.all([api("/api/sessions"), api("/api/state"), api("/api/prompt")]);
    S.sessions = cache.sessions;
    for (const s of S.sessions) {
      S.bySession[s.session_id] = s; S.byScenario[s.scenario_id] = s;
      s.turns.forEach((t, i) => S.byTrace[t.trace_id] = { session: s, turn: i });
    }
    S.prompt = prompt; S.policies = new Set(prompt.policies);
    applyState(st);
    if (!reviewSet().length) S.batch = "all";
    renderBatchSel(); buildList(); go(0);
    if (location.hash.length > 1) gotoScenario(decodeURIComponent(location.hash.slice(1)));
    status(`${S.sessions.length} sessions · cache ${fmtTime(cache.built_at)} · Langfuse sync ${S.langfuse ? "on" : "OFF"}`, !S.langfuse);
  } catch (e) { status("load failed: " + e.message, true); }
}
init();
</script>
</body>
</html>
